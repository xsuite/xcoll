name: Publish Xcoll PR benchmark comparisons

on:
  workflow_run:
    workflows: ['Xcoll performance (PR)']
    types: [completed]

permissions:
  contents: read

jobs:
  publish_pr:
    # Run only trusted main workflow code. PR results are untrusted data.
    if: >-
      github.repository == 'xsuite/xcoll' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    concurrency:
      group: xcoll-history-writer
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download completed PR comparison
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xcoll-pr-artifact"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "xcoll-pr-comparison-${RUN_ID}-${ATTEMPT}" \
            --dir "$RUNNER_TEMP/xcoll-pr-artifact"
          test -f "$RUNNER_TEMP/xcoll-pr-artifact/pr-comparison.json"
          test "$(stat -c %s "$RUNNER_TEMP/xcoll-pr-artifact/pr-comparison.json")" -le 3000000
      - name: Verify PR provenance and validate comparison data
        id: record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # The PR number, branch, and head revision come from untrusted data.
          # Verify the revision really belonged to that PR through GitHub.
          read -r PR HEAD_SHA BRANCH < <(python - "$RUNNER_TEMP/xcoll-pr-artifact/pr-comparison.json" <<'PYCODE'
          import json, sys
          from pathlib import Path
          obj=json.loads(Path(sys.argv[1]).read_text())
          pr=obj.get('pr')
          head=obj.get('head_sha')
          branch=obj.get('branch')
          if type(pr) is not int or not 0 < pr < 1000000:
              raise SystemExit('Invalid PR number')
          if not isinstance(head,str) or len(head)!=40 or any(c not in '0123456789abcdef' for c in head):
              raise SystemExit('Invalid PR head SHA')
          if not isinstance(branch,str) or not branch or len(branch)>200 or any(c.isspace() for c in branch):
              raise SystemExit('Invalid PR branch')
          print(pr,head,branch)
          PYCODE
          )
          test "$BRANCH" = "$WORKFLOW_HEAD_BRANCH"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.base.ref')" = main
          if ! gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '.[].number' | grep -Fx "$PR"; then
            echo 'Artifact revision is not associated with the claimed PR.' >&2
            exit 1
          fi
          python -m benchmarks.perf.pr_store \
            "$RUNNER_TEMP/xcoll-pr-artifact/pr-comparison.json" \
            --run-id "$RUN_ID" --attempt "$ATTEMPT" --pr "$PR" \
            --output "$RUNNER_TEMP/xcoll-pr-records" > "$RUNNER_TEMP/pr-record-path.txt"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
      - name: Append immutable comparison to benchmark-results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin benchmark-results > /dev/null; then
            git fetch origin benchmark-results
            git switch -C benchmark-results FETCH_HEAD
          else
            git switch --orphan benchmark-results
          fi
          source_file="$(cat "$RUNNER_TEMP/pr-record-path.txt")"
          target="pr-runs/${{ steps.record.outputs.pr }}/${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}.json"
          test ! -e "$target" || { echo 'PR comparison already published'; exit 0; }
          mkdir -p "$(dirname "$target")"
          cp -- "$source_file" "$target"
          git add "$target"
          git commit -m "PR #${{ steps.record.outputs.pr }} benchmark comparison ${GITHUB_RUN_ID}"
          git push origin HEAD:benchmark-results

  deploy_pr_dashboard:
    needs: publish_pr
    if: needs.publish_pr.result == 'success'
    runs-on: ubuntu-24.04
    concurrency:
      group: xcoll-performance-pages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out trusted generator
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check out permanent history
        uses: actions/checkout@v4
        with:
          ref: benchmark-results
          path: benchmark-history
      - name: Generate dashboard including PRs
        run: |
          python -m benchmarks.perf.report benchmark-history/runs \
            --config benchmarks/metrics.toml --online \
            --pr-runs benchmark-history/pr-runs -o _site/index.html
      - uses: actions/configure-pages@v5
      - name: Upload Pages site
        id: pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for Pages artefact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          : "${PAGES_ARTIFACT_ID:?Pages upload did not return an artefact ID}"
          for attempt in {1..12}; do
            if timeout 10s gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                -f name="$PAGES_ARTIFACT_NAME" \
                --jq '.artifacts[] | select(.expired == false) | .id' \
                | grep -Fx "$PAGES_ARTIFACT_ID"; then
              sleep 15
              break
            fi
            if [ "$attempt" = 12 ]; then echo 'Pages artefact unavailable' >&2; exit 1; fi
            sleep 5
          done
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}