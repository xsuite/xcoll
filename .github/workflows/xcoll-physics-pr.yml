name: Xcoll physics (PR)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number to validate against current main'
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: xcoll-physics-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  resolve:
    if: >-
      github.repository == 'xsuite/xcoll' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
        github.base_ref == 'main' && !startsWith(github.head_ref, 'release/')))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base: ${{ steps.resolve.outputs.base }}
      candidate: ${{ steps.resolve.outputs.candidate }}
      head: ${{ steps.resolve.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Resolve and pin PR revisions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          KIND: physics
        run: python -m benchmarks.perf.pr_extra resolve
      - uses: actions/upload-artifact@v4
        with:
          name: xcoll-pr-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-context.json
          if-no-files-found: error

  physics_pr:
    # Independent runner: physics validation must not disturb performance timings.
    needs: resolve
    if: needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      XCOLL_EVEREST_PHYSICS_FULL_MATRIX: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: elements
            selection: "not lhc"
          - name: lhc-b1
            selection: "lhc and b1"
          - name: lhc-b2
            selection: "lhc and b2"
    steps:
      - name: Check out main baseline (read-only)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.base }}
          path: baseline
          persist-credentials: false
          lfs: true

      - name: Check out PR merge commit (read-only)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false

      - name: Verify base of tested merge
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head }}
        run: |
          test "$(git -C candidate rev-parse HEAD^1)" = "$(git -C baseline rev-parse HEAD)"
          test "$(git -C candidate rev-parse HEAD^2)" = "$HEAD_SHA"

      - name: Select immutable reference and environment
        id: reference
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          base = Path('baseline/tests/data/everest_physics_reference').resolve()
          tmp = Path(os.environ['RUNNER_TEMP'])
          output = Path(os.environ['GITHUB_OUTPUT'])
          if base.exists():
              # Fail on a corrupt/incomplete committed reference, never silently
              # regenerate from current main. The pytest test checks the matrix.
              manifest = json.loads((base / 'reference.json').read_text())
              sha = manifest['sha']
              version = manifest['python']
              deps = manifest['deps']
              if not re.fullmatch(r'[0-9a-f]{40}', sha):
                  raise ValueError('Invalid reference SHA')
              if not re.fullmatch(r'3\.\d+\.\d+', version):
                  raise ValueError('Invalid reference Python version')
              required = {'xobjects','xtrack','xpart','xdeps','numpy','scipy','pandas'}
              allowed = required | {'xsuite','xfields'}
              if not required <= deps.keys() <= allowed:
                  raise ValueError('Invalid reference dependency inventory')
              if any(not re.fullmatch(r'[0-9][A-Za-z0-9.+!_-]*', v) for v in deps.values()):
                  raise ValueError('Invalid pinned package version')
              (tmp / 'physics-constraints.txt').write_text(''.join(
                  f'{name}=={v}\n' for name, v in sorted(deps.items())))
              values = dict(path=str(base), sha=sha, python=version, committed='true')
          else:
              # Bootstrap the first PR introducing reference-based tests.
              import subprocess
              sha = subprocess.check_output(['git','-C','baseline','rev-parse','HEAD'], text=True).strip()
              values = dict(path=str(tmp / 'physics-main'), sha=sha,
                            python='3.12', committed='false')
          with output.open('a') as f:
              for key, value in values.items():
                  print(f'{key}={value}', file=f)
          PY

      - name: Set up reference Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.reference.outputs.python }}

      - name: Prepare physics environment
        working-directory: candidate
        shell: bash
        env:
          COMMITTED_REFERENCE: ${{ steps.reference.outputs.committed }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/xcoll-pr-physics"
          source "$RUNNER_TEMP/xcoll-pr-physics/bin/activate"
          python -m pip install --upgrade pip
          if [ "$COMMITTED_REFERENCE" = true ]; then
            # Xsuite is a metapackage with release pins. The physics dependencies
            # are pinned independently and Xcoll is deliberately editable.
            grep -v '^xsuite==' "$RUNNER_TEMP/physics-constraints.txt" > "$RUNNER_TEMP/physics-core.txt"
            python -m pip install -r "$RUNNER_TEMP/physics-core.txt"
            if grep -q '^xsuite==' "$RUNNER_TEMP/physics-constraints.txt"; then
              python -m pip install --no-deps "$(grep '^xsuite==' "$RUNNER_TEMP/physics-constraints.txt")"
            fi
            python -m pip install -c "$RUNNER_TEMP/physics-constraints.txt" -e '.[tests,benchmarks]' cython xaux
          else
            python -m pip install --upgrade xsuite
            python -m pip install -e '.[tests,benchmarks]' cython xaux
          fi

      - name: Generate reference from the exact PR base (bootstrap only)
        if: steps.reference.outputs.committed == 'false'
        working-directory: candidate
        shell: bash
        env:
          PHYSICS_REFERENCE: ${{ steps.reference.outputs.path }}
          PHYSICS_REF_SHA: ${{ steps.reference.outputs.sha }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/xcoll-pr-physics/bin/activate"
          python benchmarks/everest_compare_physics.py reference \
            --repo "$GITHUB_WORKSPACE/baseline" \
            --ref "$PHYSICS_REF_SHA" \
            --data "$GITHUB_WORKSPACE/baseline/tests/data" \
            --output "$PHYSICS_REFERENCE" \
            --particles 20000 \
            --lhc-particles 20000 \
            --turns 10 \
            --events-per-particle 12 \
            --case-particles block-tungsten-26gev=500000 \
            --case-particles crystal-amorphous-26gev=100000 \
            --case-particles block-cfc-7000gev=100000

      - name: Prebuild candidate physics kernels
        id: prebuild
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/xcoll-pr-physics/bin/activate"
          # Xsuite and Xfields are optional in a developer's reference environment.
          # Use forced JIT in that case rather than failing the physics test.
          if ! python -c 'import importlib.util as u, sys; sys.exit(not all(u.find_spec(p) is not None for p in ("xsuite", "xfields")))'; then
            echo 'Xsuite or Xfields not installed; using forced JIT compilation.'
            echo 'use_prebuilt=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m benchmarks.perf.prebuild_cpu \
            --skip-tpsa \
            --skip-synrad \
            --n-threads 2 \
            --clear-existing
          echo 'use_prebuilt=1' >> "$GITHUB_OUTPUT"

      - name: Test PR physics against reference
        working-directory: candidate/tests
        shell: bash
        env:
          XCOLL_EVEREST_PHYSICS_REFERENCE: ${{ steps.reference.outputs.path }}
          XCOLL_EVEREST_PHYSICS_REF_SHA: ${{ steps.reference.outputs.sha }}
          XCOLL_EVEREST_PHYSICS_USE_PREBUILT: ${{ steps.prebuild.outputs.use_prebuilt }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/xcoll-pr-physics/bin/activate"
          python -m pytest test_everest_physics_reference.py -v \
            -k "${{ matrix.selection }}" \
            --durations=0 \
            -o junit_logging=system-out -o junit_log_passing_tests=true \
            --junitxml="$RUNNER_TEMP/physics-pr.xml"

      - name: Upload physics validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcoll-pr-physics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          path: ${{ runner.temp }}/physics-pr.xml
          if-no-files-found: warn
          retention-days: 90

      - name: Archive generated base reference for review (bootstrap only)
        if: always() && steps.reference.outputs.committed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: xcoll-physics-base-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          path: ${{ steps.reference.outputs.path }}
          if-no-files-found: warn
          retention-days: 90
