name: Xcoll performance (FLUKA)

on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * *'

permissions:
  contents: read

jobs:
  benchmark_fluka:
    if: github.repository == 'xsuite/xcoll' && github.ref == 'refs/heads/main'
    runs-on:
      group: xcoll-benchmarks
      labels: [self-hosted, linux, x64, xcoll-bench-cpu]
    timeout-minutes: 180
    concurrency:
      group: xcoll-cern-benchmark-cpu
      cancel-in-progress: false
      queue: max
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      measured: ${{ steps.check_measurements.outputs.measured }}
    env:
      MINIFORGE_ROOT: /home/xcollrunner/miniforge3
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BENCHMARK_TESTBED: cern-openstack-xcoll-fluka-v1
      BENCHMARK_PHYSICAL_HOST: cern-openstack-xcoll-vm-v1
      XCOLL_FLUKA_ROOT: ${{ vars.XCOLL_FLUKA_ROOT }}
      XCOLL_FLUKA_SERVER: ${{ vars.XCOLL_FLUKA_SERVER }}
      XCOLL_FLUKAIO_LIB: ${{ vars.XCOLL_FLUKAIO_LIB }}
      XCOLL_LINEBUILDER_ROOT: ${{ vars.XCOLL_LINEBUILDER_ROOT }}
      XCOLL_FLUKA_FEDB: ${{ vars.XCOLL_FLUKA_FEDB }}
      BENCHMARK_FLUKA_VERSION: ${{ vars.BENCHMARK_FLUKA_VERSION }}
      BENCHMARK_LINEBUILDER_VERSION: ${{ vars.BENCHMARK_LINEBUILDER_VERSION }}
      BENCHMARK_FLUKAIO_VERSION: ${{ vars.BENCHMARK_FLUKAIO_VERSION }}

    steps:
      - name: Check out trusted source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Configure environment paths and remove stale benchmark state
        shell: bash
        run: |
          set -euo pipefail
          # Jobs are mutually exclusive across all CERN benchmark workflows.
          for dir in "$RUNNER_TEMP"/xcoll-perf-* "$RUNNER_TEMP"/xcoll-fluka-* "$RUNNER_TEMP"/xcoll-geant4-*; do
            if [ -d "$dir" ]; then
              echo "Removing stale benchmark state: $dir"
              rm -rf -- "$dir"
            fi
          done
          env_dir="$RUNNER_TEMP/xcoll-fluka-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "BENCH_ENV=$env_dir" >> "$GITHUB_ENV"
          echo "XCOLL_PATH=${env_dir}-state" >> "$GITHUB_ENV"

      - name: Record tested revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create Mamba environment and compiler toolchain
        shell: bash
        run: |
          set -euo pipefail
          "$MINIFORGE_ROOT/bin/mamba" create --yes --prefix "$BENCH_ENV" \
            --override-channels --channel conda-forge \
            python=3.12 pip \
            make cmake meson ninja \
            gcc_linux-64 gxx_linux-64 gfortran_linux-64
          source "$MINIFORGE_ROOT/etc/profile.d/conda.sh"
          conda activate "$BENCH_ENV"
          test "$CONDA_PREFIX" = "$BENCH_ENV"
          python --version
          echo "CC=$CC"; echo "CXX=$CXX"; echo "FC=$FC"
          "$CC" -dumpversion
          "$CXX" -dumpversion
          "$FC" -dumpversion
          rm -rf benchmarks/results

      - name: Install Xsuite and benchmark dependencies
        shell: bash
        run: |
          set -euo pipefail
          source "$MINIFORGE_ROOT/etc/profile.d/conda.sh"
          conda activate "$BENCH_ENV"
          python -m pip install --upgrade pip
          python -m pip install --upgrade xsuite
          python -m pip install -e '.[benchmarks]' cython

      - name: Compile non-TPSA Xsuite serial kernels (sequentially)
        shell: bash
        run: |
          set -euo pipefail
          source "$MINIFORGE_ROOT/etc/profile.d/conda.sh"
          conda activate "$BENCH_ENV"
          python -m benchmarks.perf.prebuild_cpu --skip-tpsa --skip-synrad --n-threads 2

      - name: Compile Xcoll FLUKA interface in active environment
        shell: bash
        run: |
          set -euo pipefail
          source "$MINIFORGE_ROOT/etc/profile.d/conda.sh"
          conda activate "$BENCH_ENV"
          : "${XCOLL_FLUKA_ROOT:?Set XCOLL_FLUKA_ROOT in GitHub Actions variables}"
          : "${XCOLL_FLUKA_SERVER:?Set XCOLL_FLUKA_SERVER in GitHub Actions variables}"
          : "${XCOLL_FLUKAIO_LIB:?Set XCOLL_FLUKAIO_LIB in GitHub Actions variables}"
          : "${XCOLL_LINEBUILDER_ROOT:?Set XCOLL_LINEBUILDER_ROOT in GitHub Actions variables}"
          # rfluka requires an unprefixed gfortran executable,
          # independently of the Conda compiler used for Xcoll.
          command -v gfortran || {
              echo "FLUKA requires gfortran on PATH."
              echo "On AlmaLinux: sudo dnf install gcc-gfortran"
              exit 1
          }
          gfortran --version
          python -m benchmarks.perf.setup_external fluka

      - name: Record resolved dependencies
        shell: bash
        run: |
          set -euo pipefail
          source "$MINIFORGE_ROOT/etc/profile.d/conda.sh"
          conda activate "$BENCH_ENV"
          python --version > benchmark-dependencies.txt
          python -m pip freeze >> benchmark-dependencies.txt
          python -m benchmarks.perf.dependencies >> benchmark-dependencies.txt
          "$MINIFORGE_ROOT/bin/mamba" list --prefix "$BENCH_ENV" --explicit > benchmark-conda-spec.txt

      - name: Benchmark FLUKA
        working-directory: benchmarks
        shell: bash
        run: |
          set -euo pipefail
          source "$MINIFORGE_ROOT/etc/profile.d/conda.sh"
          conda activate "$BENCH_ENV"
          python -m pytest -m fluka --basetemp="$RUNNER_TEMP/xcoll-fluka-diagnostics"

      - name: Print FLUKA startup errors
        if: failure()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/xcoll-fluka-diagnostics" ]; then
            find "$RUNNER_TEMP/xcoll-fluka-diagnostics" \
              -name rfluka.log -print -exec tail -n 100 {} \;
          fi

      - name: Check for executed benchmark measurements
        id: check_measurements
        shell: bash
        run: |
          "$BENCH_ENV/bin/python" - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          has_data = False
          for path in Path('benchmarks/results').rglob('*.json'):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  continue
              has_data |= bool(data.get('benchmarks'))
          print('measured=' + ('true' if has_data else 'false'))
          PYCODE
          if [ "$(find benchmarks/results -name '*.json' -print -quit 2>/dev/null)" = '' ]; then
            echo 'No benchmark output: all optional cases may have been skipped.'
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcoll-external-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/results/
            benchmark-dependencies.txt
            benchmark-conda-spec.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Remove disposable environment and interface
        if: always()
        shell: bash
        run: |
          if [ -n "${BENCH_ENV:-}" ] && [ -d "$BENCH_ENV/conda-meta" ]; then
            "$MINIFORGE_ROOT/bin/mamba" env remove --yes --prefix "$BENCH_ENV" || true
          fi
          if [ -n "${BENCH_ENV:-}" ]; then rm -rf -- "$BENCH_ENV"; fi
          if [ -n "${XCOLL_PATH:-}" ]; then rm -rf -- "$XCOLL_PATH"; fi

  publish:
    needs: benchmark_fluka
    if: needs.benchmark_fluka.result == 'success' && needs.benchmark_fluka.outputs.measured == 'true'
    uses: ./.github/workflows/xcoll-performance-publish.yml
    with:
      artifact: xcoll-external-${{ github.run_id }}-${{ github.run_attempt }}
      sha: ${{ needs.benchmark_fluka.outputs.sha }}
      profile: fluka
      branch: main
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
