name: Deploy Xcoll benchmark dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_dashboard:
    # Only reviewed main code may deploy the public dashboard.
    if: github.repository == 'xsuite/xcoll' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: xcoll-performance-pages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get trusted website generator
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Get permanent benchmark history
        uses: actions/checkout@v4
        with:
          ref: benchmark-results
          path: benchmark-history
      - name: Generate dashboard
        run: |
          python -m benchmarks.perf.report benchmark-history/runs \
            --config benchmarks/metrics.toml --online -o _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the Pages site
        id: pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      # The upload can finish before the artefact is visible to deploy-pages.
      - name: Wait for Pages artefact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          : "${PAGES_ARTIFACT_ID:?Pages upload did not return an artefact ID}"
          for attempt in {1..12}; do
            if timeout 10s gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                -f name="$PAGES_ARTIFACT_NAME" \
                --jq '.artifacts[] | select(.expired == false) | .id' \
                | grep -Fx "$PAGES_ARTIFACT_ID"; then
              echo "Pages artefact is visible; allowing time for deployment metadata to propagate."
              sleep 15
              exit 0
            fi
            echo "Waiting for Pages artefact (attempt $attempt/12)..."
            sleep 5
          done
          echo "::error::Pages artefact metadata did not become available."
          exit 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
