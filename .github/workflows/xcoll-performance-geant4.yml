name: Xcoll performance (Geant4/BDSIM)

on:
  workflow_dispatch:
  # Enable after validating the environment on the CERN VM:
  # schedule:
  #   - cron: '57 8 * * *'

permissions:
  contents: read

jobs:
  benchmark_geant4:
    if: github.repository == 'xsuite/xcoll' && github.ref == 'refs/heads/main'
    runs-on:
      group: xcoll-benchmarks
      labels: [self-hosted, linux, x64, xcoll-bench-cpu]
    timeout-minutes: 180
    concurrency:
      group: xcoll-cern-benchmark-cpu
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    env:
      MINIFORGE_ROOT: /home/xcollrunner/miniforge3
      BENCH_ENV: ${{ runner.temp }}/xcoll-geant4-${{ github.run_id }}-${{ github.run_attempt }}
      XCOLL_PATH: ${{ runner.temp }}/xcoll-geant4-${{ github.run_id }}-${{ github.run_attempt }}-state
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BENCHMARK_TESTBED: cern-openstack-xcoll-geant4-v1

    steps:
      - name: Check out trusted source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Record tested revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create Mamba environment including BDSIM and Geant4
        shell: bash
        run: |
          set -euo pipefail
          "$MINIFORGE_ROOT/bin/mamba" create --yes --prefix "$BENCH_ENV" \
            --override-channels --channel conda-forge \
            python=3.14 pip bdsim-g4 make cmake \
            "hdf5=1.14.6=nompi_*" "expat=2.8.1" \
            cxx-compiler
          source "$MINIFORGE_ROOT/etc/profile.d/conda.sh"
          conda activate "$BENCH_ENV"
          test "$CONDA_PREFIX" = "$BENCH_ENV"
          python --version
          geant4-config --version
          bdsim --version
          rm -rf benchmarks/results

      - name: Install Xsuite and benchmark dependencies
        shell: bash
        run: |
          set -euo pipefail
          source "$MINIFORGE_ROOT/etc/profile.d/conda.sh"
          conda activate "$BENCH_ENV"
          python -m pip install --upgrade pip
          python -m pip install --upgrade xsuite
          python -m pip install -e '.[benchmarks]' cython pybind11 rpyc

      - name: Compile non-TPSA Xsuite serial kernels (sequentially)
        shell: bash
        run: |
          set -euo pipefail
          source "$MINIFORGE_ROOT/etc/profile.d/conda.sh"
          conda activate "$BENCH_ENV"
          python -m benchmarks.perf.prebuild_cpu --skip-tpsa

      - name: Compile Xcoll Geant4/BDSIM interface in active environment
        shell: bash
        run: |
          set -euo pipefail
          source "$MINIFORGE_ROOT/etc/profile.d/conda.sh"
          conda activate "$BENCH_ENV"
          geant4-config --version
          bdsim --version
          python -m benchmarks.perf.setup_external geant4

      - name: Record resolved dependencies
        shell: bash
        run: |
          set -euo pipefail
          source "$MINIFORGE_ROOT/etc/profile.d/conda.sh"
          conda activate "$BENCH_ENV"
          python --version > benchmark-dependencies.txt
          python -m pip freeze >> benchmark-dependencies.txt
          python -m benchmarks.perf.dependencies >> benchmark-dependencies.txt
          "$MINIFORGE_ROOT/bin/mamba" list --prefix "$BENCH_ENV" --explicit > benchmark-conda-spec.txt

      - name: Benchmark Geant4
        working-directory: benchmarks
        shell: bash
        run: |
          set -euo pipefail
          source "$MINIFORGE_ROOT/etc/profile.d/conda.sh"
          conda activate "$BENCH_ENV"
          python -m pytest -m geant4

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcoll-external-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/results/
            benchmark-dependencies.txt
            benchmark-conda-spec.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Remove disposable environment and interface
        if: always()
        shell: bash
        run: |
          if [ -d "$BENCH_ENV/conda-meta" ]; then
            "$MINIFORGE_ROOT/bin/mamba" env remove --yes --prefix "$BENCH_ENV" || true
          fi
          rm -rf -- "$BENCH_ENV" "$XCOLL_PATH"

  publish:
    needs: benchmark_geant4
    if: needs.benchmark_geant4.result == 'success'
    uses: ./.github/workflows/xcoll-performance-publish.yml
    with:
      artifact: xcoll-external-${{ github.run_id }}-${{ github.run_attempt }}
      sha: ${{ needs.benchmark_geant4.outputs.sha }}
      profile: geant4
      branch: main
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
