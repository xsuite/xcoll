[pytest]
python_files = bench_*.py
python_functions = bench_*

addopts =
    -ra
    --strict-markers
    --benchmark-columns=median,mean,stddev,rounds
    --benchmark-autosave
    --benchmark-save-data
    --benchmark-storage=file://./results

markers =
    quick: routine developer benchmarks
    full: expensive CPU physics or LHC benchmarks
    benchmark: pytest-benchmark grouping options