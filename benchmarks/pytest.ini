[pytest]
python_files = bench_*.py
python_functions = bench_*

addopts =
    -ra
    --strict-markers
    -m "not fluka and not geant4"
    --benchmark-columns=median,mean,stddev,rounds
    --benchmark-autosave
    --benchmark-save-data
    --benchmark-storage=file://./results

markers =
    quick: routine developer benchmark
    full: expensive CPU physics or LHC benchmark
    fluka: benchmark requiring FLUKA, FlukaIO and LineBuilder
    geant4: benchmark requiring Geant4 and BDSIM
    benchmark: pytest-benchmark grouping/measurement options
