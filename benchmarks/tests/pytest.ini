[pytest]
# Benchmarks and infrastructure tests use separate collection conventions.
# From this directory `python -m pytest` discovers test_* rather than bench_*.
python_files = test_*.py
python_functions = test_*
pythonpath = .. ../..
addopts = -ra

markers =
    fluka: benchmark requiring FLUKA
    geant4: benchmark requiring Geant4/BDSIM
    gpu: GPU benchmark
    quick: routine developer benchmark
    full: expensive CPU benchmark
    benchmark: pytest-benchmark grouping/measurement options
